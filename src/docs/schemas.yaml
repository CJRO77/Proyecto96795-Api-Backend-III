components:

#Los componentes son definiciones reutilizables de esquemas, respuestas y parámetros que se pueden referenciar en múltiples endpoints.
  
  responses:
    InvalidId:
      description: El identificador enviado en la URL no tiene un formato válido de ObjectId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            error: INVALID_ID
            message: El identificador enviado no tiene un formato válido
            details: '_id: "abc"'
    InternalServerError:
      description: Error inesperado del servidor. El detalle técnico queda registrado en el log, nunca se expone al cliente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            error: INTERNAL_SERVER_ERROR
            message: Ocurrió un error inesperado en el servidor

  schemas:

    # contrato de datos que se espera recibir o enviar en la API, y que se documenta en Swagger.

    SuccessResponse:
      type: object
      description: Estructura base de toda respuesta exitosa de la API.
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: Solo está presente al crear, actualizar o eliminar un recurso.
          example: Operación realizada correctamente
        payload:
          description: Datos devueltos. Es un objeto o un arreglo según el endpoint.

    ErrorResponse:
      type: object
      description: Estructura uniforme de todos los errores de la API.
      required:
        - status
        - error
        - message
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Código estable del error, definido en el diccionario de errores.
          enum:
            - USER_NOT_FOUND
            - USER_ALREADY_EXISTS
            - INVALID_USER_ROLE
            - PRODUCT_NOT_FOUND
            - ORDER_NOT_FOUND
            - ORDER_ITEMS_REQUIRED
            - INVALID_ORDER_STATUS
            - ORDER_ALREADY_DELIVERED
            - DELIVERY_NOT_FOUND
            - INVALID_DELIVERY_STATUS
            - DRIVER_NOT_AVAILABLE
            - INVALID_MOCK_AMOUNT
            - INVALID_MOCK_ENTITY
            - MOCK_GENERATION_ERROR
            - VALIDATION_ERROR
            - INVALID_ID
            - ROUTE_NOT_FOUND
            - INTERNAL_SERVER_ERROR
          example: ORDER_NOT_FOUND
        message:
          type: string
          example: El pedido solicitado no existe
        details:
          type: string
          description: Información adicional para debugging. Solo se incluye cuando NODE_ENV no es production.
          example: 'id: 665f4d0a8f9a1b001234abcd'

   # usuarios, productos, pedidos y entregas se documentan en sus respectivos archivos YAML.

    User:
      type: object
      description: Usuario registrado. Nunca incluye el password.
      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b001234abce
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Pérez
        email:
          type: string
          example: ana.perez@test.com
        role:
          type: string
          enum: [ADMIN, USER, CUSTOMER, DRIVER, STORE]
          example: USER
        isAvailable:
          type: boolean
          description: Relevante para usuarios con rol DRIVER (repartidores).
          example: true

    UserInput:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Pérez
        email:
          type: string
          example: ana.perez@test.com
        password:
          type: string
          description: Se guarda hasheado con bcrypt.
          example: coder123

    UserUpdateInput:
      type: object
      description: Todos los campos son opcionales; solo se modifican los que se envíen.
      properties:
        firstName:
          type: string
          example: Ana María
        lastName:
          type: string
          example: Pérez
        email:
          type: string
          example: ana.perez@test.com
        password:
          type: string
          example: nuevaClave123

   # productos.

    Product:
      type: object
      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b001234abcf
        name:
          type: string
          example: Caja de envío mediana
        description:
          type: string
          example: Caja de cartón para envíos
        price:
          type: number
          example: 2500
        stock:
          type: integer
          example: 10
        status:
          type: string
          enum: [AVAILABLE, OUT_OF_STOCK]
          description: Lo calcula el service según el stock (stock 0 → OUT_OF_STOCK).
          example: AVAILABLE

    ProductInput:
      type: object
      required:
        - name
        - description
        - price
        - stock
      properties:
        name:
          type: string
          example: Caja de envío mediana
        description:
          type: string
          example: Caja de cartón para envíos
        price:
          type: number
          minimum: 0
          example: 2500
        stock:
          type: integer
          minimum: 0
          example: 10

    ProductUpdateInput:
      type: object
      description: Todos los campos son opcionales; solo se modifican los que se envíen.
      properties:
        name:
          type: string
          example: Caja de envío grande
        description:
          type: string
          example: Caja de cartón reforzada
        price:
          type: number
          minimum: 0
          example: 3200
        stock:
          type: integer
          minimum: 0
          example: 5

   # pedidos.

    OrderItem:
      type: object
      required:
        - name
        - quantity
        - price
      properties:
        name:
          type: string
          example: Paquete mediano
        quantity:
          type: integer
          minimum: 1
          example: 2
        price:
          type: number
          minimum: 0
          example: 1500

    Order:
      type: object
      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b001234abd0
        customer:
          type: string
          description: Id del usuario que realizó el pedido.
          example: 665f4d0a8f9a1b001234abce
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          type: string
          example: Av. Siempre Viva 742
        total:
          type: number
          description: Lo calcula el service como la suma de quantity * price de cada item.
          example: 3000
        status:
          type: string
          enum: [CREATED, ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED, CANCELLED]
          example: CREATED
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH]
          example: NORMAL
        createdAt:
          type: string
          format: date-time
          example: '2026-10-07T14:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-07T14:30:00.000Z'

    OrderInput:
      type: object
      required:
        - customer
        - items
        - deliveryAddress
      properties:
        customer:
          type: string
          description: Id de un usuario existente.
          example: 665f4d0a8f9a1b001234abce
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          type: string
          example: Av. Siempre Viva 742
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH]
          description: Opcional. Si no se envía, el pedido queda con prioridad NORMAL.
          example: HIGH

    OrderStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [CREATED, ASSIGNED, PICKED_UP, IN_TRANSIT, DELIVERED, CANCELLED]
          example: IN_TRANSIT

    # entregas.

    Delivery:
      type: object
      properties:
        _id:
          type: string
          example: 665f4d0a8f9a1b001234abd1
        order:
          type: string
          description: Id del pedido al que pertenece la entrega.
          example: 665f4d0a8f9a1b001234abd0
        driver:
          type: string
          nullable: true
          description: Id del repartidor asignado, o null si todavía no tiene.
          example: 665f4d0a8f9a1b001234abd2
        status:
          type: string
          enum: [PENDING, ASSIGNED, IN_TRANSIT, DELIVERED, FAILED]
          example: ASSIGNED
        createdAt:
          type: string
          format: date-time
          example: '2026-10-07T14:35:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-07T14:35:00.000Z'

    DeliveryInput:
      type: object
      required:
        - order
      properties:
        order:
          type: string
          description: Id de un pedido existente.
          example: 665f4d0a8f9a1b001234abd0
        driver:
          type: string
          description: Opcional. Id de un usuario con rol DRIVER que esté disponible. Si se envía, la entrega nace ASSIGNED; si no, PENDING.
          example: 665f4d0a8f9a1b001234abd2

    DeliveryStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, ASSIGNED, IN_TRANSIT, DELIVERED, FAILED]
          example: DELIVERED

 # esquemas de datos de prueba para el endpoint /api/mock.

    MockUser:
      type: object
      properties:
        firstName:
          type: string
          example: Camila
        lastName:
          type: string
          example: Gómez
        email:
          type: string
          example: camila.gómez.17900001234@test.com
        password:
          type: string
          example: coder123
        role:
          type: string
          example: CUSTOMER

    MockDriver:
      allOf:
        - $ref: '#/components/schemas/MockUser'
        - type: object
          properties:
            role:
              type: string
              example: DRIVER
            isAvailable:
              type: boolean
              example: true

    MockOrder:
      type: object
      properties:
        customer:
          type: string
          description: ObjectId con formato válido pero inventado (el endpoint no guarda nada).
          example: 665f4d0a8f9a1b001234abce
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          type: string
          example: Calle Falsa 123
        total:
          type: number
          example: 2400
        status:
          type: string
          example: CREATED
        priority:
          type: string
          example: NORMAL

    MockDelivery:
      type: object
      properties:
        order:
          type: string
          example: 665f4d0a8f9a1b001234abd0
        driver:
          type: string
          nullable: true
          example: null
        status:
          type: string
          example: PENDING

    MockSeedResult:
      type: object
      properties:
        insertados:
          type: integer
          example: 10
        coleccion:
          type: string
          example: usuarios